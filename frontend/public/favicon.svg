<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle with elegant gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#bg-grad)" />
  
  <!-- Subtle digital/telemed signal waves in background -->
  <path d="M 120 256 C 180 160, 332 160, 392 256" stroke="#ffffff" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.15" />
  <path d="M 160 256 C 200 190, 312 190, 352 256" stroke="#ffffff" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.25" />
  
  <!-- Medical Cross in the center with modern rounded style and subtle shadow -->
  <rect x="226" y="116" width="60" height="280" rx="30" fill="#ffffff" filter="url(#glow)" />
  <rect x="116" y="226" width="280" height="60" rx="30" fill="#ffffff" filter="url(#glow)" />
  
  <!-- Digital ECG Heartbeat line going through the center of the cross -->
  <path d="M 140 256 L 195 256 L 215 170 L 245 340 L 270 200 L 290 275 L 305 256 L 372 256" stroke="#2563eb" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>